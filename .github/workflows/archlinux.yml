name: Native Arch Linux release

on:
  schedule:
    - cron: '53 20 * * *' # Daily upstream check.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archlinux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      upstream: ${{ steps.source.outputs.upstream }}
      tag: ${{ steps.source.outputs.tag }}
      build_required: ${{ steps.source.outputs.build_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve immutable upstream and native policy revisions
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then args+=(--no-release-check); fi
          python3 .github/workflows/ctr/prepare.py "${args[@]}"

  validate:
    needs: sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.sync.outputs.commit }}
      - name: Check native packaging and installer regressions
        run: |
          for script in .github/workflows/ctr/arch/PKGBUILD .github/workflows/ctr/arch/ctr-nitrofueled .github/workflows/ctr/arch/*.sh; do
            bash -n "$script"
          done
          python3 -m unittest discover -s .github/workflows/ctr -p 'test_*.py' -v

  build:
    needs: [sync, validate]
    if: needs.sync.outputs.build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.sync.outputs.commit }}
      - name: Build and test with Arch makepkg
        env:
          SOURCE_COMMIT: ${{ needs.sync.outputs.commit }}
          UPSTREAM_COMMIT: ${{ needs.sync.outputs.upstream }}
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          mkdir -p .github/workflows/.build/release
          docker run --rm -e CTR_COMMIT="$SOURCE_COMMIT" -e CTR_UPSTREAM="$UPSTREAM_COMMIT" \
            --mount "type=bind,src=$PWD,dst=/repo,readonly" \
            --mount "type=bind,src=$PWD/.github/workflows/.build/release,dst=/output" \
            archlinux:base-devel bash /repo/.github/workflows/ctr/arch/ci-build.sh
          cp .github/workflows/ctr/arch/install.sh .github/workflows/.build/release/install.sh
          printf '{"policy":"%s","upstream":"%s"}\n' "$SOURCE_COMMIT" "$UPSTREAM_COMMIT" > .github/workflows/.build/release/upstream.json
          cd .github/workflows/.build/release
          sha256sum *.pkg.tar.zst PKGBUILD SRCINFO install.sh upstream.json > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ctr-nitrofueled-arch-x86_64
          path: .github/workflows/.build/release/*
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: [sync, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.sync.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ctr-nitrofueled-arch-x86_64
          path: .github/workflows/.build/release
      - name: Verify and open the native package on clean Arch
        run: |
          (cd .github/workflows/.build/release && sha256sum --check SHA256SUMS)
          docker run --rm \
            --mount "type=bind,src=$PWD,dst=/repo,readonly" \
            --mount "type=bind,src=$PWD/.github/workflows/.build/release,dst=/release,readonly" \
            archlinux:base bash /repo/.github/workflows/ctr/arch/smoke-test.sh

  publish:
    needs: [sync, smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ctr-nitrofueled-arch-x86_64
          path: .github/workflows/.build/release
      - name: Publish verified native Arch release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ needs.sync.outputs.commit }}
          RELEASE_TAG: ${{ needs.sync.outputs.tag }}
        run: |
          cd .github/workflows/.build/release
          sha256sum --check SHA256SUMS
          tag="$RELEASE_TAG"
          cat > notes.md <<'NOTES'
          Native x86_64 Arch Linux package, also suitable for Omarchy.

          Install or update with the same command:

          ```bash
          curl -fsSL https://github.com/zamkara/CTR-NitroFueled/releases/latest/download/install.sh | bash
          ```

          The installer verifies the package checksum and skips an already current version. Pacman manages dependencies and removal. Requires an AVX-capable CPU, a Vulkan 1.3 driver and your own game dump. No game data is included. Headless launcher checks do not establish gameplay compatibility.
          NOTES
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$SOURCE_COMMIT" --title "CTR-NitroFueled ${SOURCE_COMMIT:0:12}" --notes-file notes.md
          fi
          gh release upload "$tag" ./*.pkg.tar.zst PKGBUILD SRCINFO install.sh SHA256SUMS upstream.json --clobber
          gh release edit "$tag" --draft=false --prerelease=false --latest
